name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages on every push to
# `main`. The site is fully static - there is nothing to refresh on a schedule.

on:
  push:
    branches: [main]
  workflow_dispatch:

# No permissions by default; each job below grants only what it needs.
permissions: {}

# Allow only one concurrent Pages deployment, without cancelling in-progress
# runs - cancelling mid-deployment can leave the Pages site in a partial state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      - name: Build with Astro
        uses: withastro/action@v6.1.2

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
